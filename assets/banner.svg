<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1420"/>
      <stop offset="55%" stop-color="#0f2233"/>
      <stop offset="100%" stop-color="#0a1a28"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6fdff"/>
      <stop offset="100%" stop-color="#8ff0e0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1e3a4d" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="350" y1="0" x2="350" y2="360"/>
    <line x1="550" y1="0" x2="550" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="950" y1="0" x2="950" y2="360"/>
    <line x1="1150" y1="0" x2="1150" y2="360"/>
  </g>

  <!-- glow behind globe -->
  <circle cx="960" cy="180" r="200" fill="url(#glow)"/>

  <!-- globe / world node network on right -->
  <g>
    <circle cx="960" cy="180" r="118" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.55"/>
    <ellipse cx="960" cy="180" rx="118" ry="42" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
    <ellipse cx="960" cy="180" rx="118" ry="80" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.3"/>
    <ellipse cx="960" cy="180" rx="60" ry="118" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.3"/>
    <line x1="960" y1="62" x2="960" y2="298" stroke="#2dd4bf" stroke-width="1" opacity="0.35"/>
    <line x1="842" y1="180" x2="1078" y2="180" stroke="#2dd4bf" stroke-width="1" opacity="0.35"/>

    <!-- connection lines between nodes -->
    <path d="M 900 120 L 1010 150 L 990 230 L 900 120" fill="none" stroke="#34d399" stroke-width="1.2" opacity="0.65"/>
    <path d="M 900 120 L 940 220" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.5"/>
    <path d="M 1010 150 L 940 220" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.5"/>

    <!-- nodes -->
    <circle cx="900" cy="120" r="14" fill="url(#nodeGlow)"/>
    <circle cx="900" cy="120" r="5" fill="#a7f3d0"/>
    <circle cx="1010" cy="150" r="14" fill="url(#nodeGlow)"/>
    <circle cx="1010" cy="150" r="5" fill="#67e8f9"/>
    <circle cx="990" cy="230" r="14" fill="url(#nodeGlow)"/>
    <circle cx="990" cy="230" r="5" fill="#67e8f9"/>
    <circle cx="940" cy="220" r="14" fill="url(#nodeGlow)"/>
    <circle cx="940" cy="220" r="5" fill="#a7f3d0"/>

    <!-- pin marker for geolocation -->
    <g transform="translate(1030,110)">
      <path d="M0 0 C -12 0 -20 8 -20 20 C -20 34 0 52 0 52 C 0 52 20 34 20 20 C 20 8 12 0 0 0 Z" fill="#fb923c" opacity="0.9"/>
      <circle cx="0" cy="18" r="7" fill="#0a1420"/>
    </g>
  </g>

  <!-- speed/ping lines on the left, evoking latency check -->
  <g stroke="#34d399" stroke-width="2.5" opacity="0.55" stroke-linecap="round">
    <line x1="60" y1="300" x2="150" y2="300"/>
    <line x1="60" y1="288" x2="120" y2="288"/>
    <line x1="60" y1="312" x2="105" y2="312"/>
  </g>

  <!-- shield check icon -->
  <g transform="translate(70,58)">
    <path d="M20 0 L40 8 L40 26 C40 42 20 52 20 52 C20 52 0 42 0 26 L0 8 Z" fill="none" stroke="url(#ring)" stroke-width="2.5"/>
    <path d="M10 24 L18 32 L32 14" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- headline -->
  <text x="60" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="700" fill="url(#headGrad)" textLength="620" lengthAdjust="spacingAndGlyphs">Proxy Checker</text>

  <!-- tagline -->
  <text x="60" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#bcd9e0" textLength="760" lengthAdjust="spacingAndGlyphs">Verifies proxy speed and anonymity with built-in geolocation</text>
  <text x="60" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#7fd7c4" textLength="330" lengthAdjust="spacingAndGlyphs">lookup — single binary</text>

  <!-- small status dots -->
  <g fill="#34d399">
    <circle cx="70" cy="290" r="4"/>
    <circle cx="90" cy="290" r="4" opacity="0.7"/>
    <circle cx="110" cy="290" r="4" opacity="0.4"/>
  </g>
</svg>